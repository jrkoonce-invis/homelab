# 1. An identity for the stats-api pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stats-api
  namespace: stats
---
# 2. A set of permissions: read-only access to pods, nodes and deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stats-reader
rules:
  - apiGroups: [""]              # "" = the core API group (pods, nodes, services...)
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]          # deployments live in the "apps" group
    resources: ["deployments"]
    verbs: ["get", "list"]
---
# 3. Give those permissions to that identity
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stats-api-reads-cluster
subjects:
  - kind: ServiceAccount
    name: stats-api
    namespace: stats
roleRef:
  kind: ClusterRole
  name: stats-reader
  apiGroup: rbac.authorization.k8s.io